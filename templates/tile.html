<article class="tile $position" style="$style">
<div class="tile-tx">
<img class="ic" src="$icon" alt="" width="80" height="80">
<h2>$name</h2>
<p class="sub">$subtitle</p>
$hook
<p class="tile-act">$more<a class="as" href="$store" aria-label="$store_label">App Store ↗</a></p>
</div>
<div class="shot" style="$crop"><img src="$shot" alt="$shot_alt" loading="lazy"></div>
</article>

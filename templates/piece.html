<article class="piece" id="$slug">
<div class="frame"><span class="tick"></span><span class="tick2"></span>
<span class="lab">No. $no / $total</span><span class="readout" data-readout="$i" aria-hidden="true"></span>
<button class="slot" type="button" data-plate="$i" data-open="$i" aria-label="$view_label"><img src="$icon" alt="" width="340" height="340" loading="lazy"></button>
</div>
<div class="cap">
<h2>$name</h2>
<p class="sub">$subtitle</p>
<p class="hook">$summary</p>
<p class="acts"><a class="btn" href="$store" aria-label="$store_label">App Store ↗</a>$more<button class="lnk big" type="button" data-open="$i">$view</button></p>
</div>
</article>
